# nginx为一个master进程和多个worker进程，worker进程为具体工作进程，nginx worker进程为 nginx master 进程的子进程

# worker进程的用户，当主进程为root时，即以root用户运行nginx时，此配置项生效，以其他用户运行nginx时，worker进程的用户和master进程用户一致
#user  nobody;

# workr进程数，一般和cpu内核数一致即可，设置为auto时候，自动设置为cpu核心数，也可以手动修改
worker_processes  auto;


# 错误日志级别：debug, info, notice, warn, error, crit
#error_log  logs/error.log;
#error_log  logs/error.log  notice; 
error_log  logs/error.log  info;


# pid文件的位置
#pid        logs/nginx.pid;

events {
    # 每个workr进程的最大连接数，nginx的最大并发数等于 worker_processes数 x worker_connections数
    worker_connections  1024;
}



# http模块
http {

    #上传文件大小，默认是1M，如果超过此限制，会报413错误(413 Request Entity Too Large)
    client_max_body_size 1m;

    # 一个server监听一个端口，相当于一个网站
    server {
        # 监听端口
        listen       80;
        # 可以设置域名，例如设置test.com之后，当dns解析到此ip，则可以用test.com来访问
        server_name  test.com;

        #charset koi8-r;


        #定义的日志记录格式，可以自定义,默认有个main，main为日志记录格式标签
        #log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
        #                  '$status $body_bytes_sent "$http_referer" '
        #                  '"$http_user_agent" "$http_x_forwarded_for"';

        # 访问日志，此server的访问日志，日志记录格式为main，可用log_format定义其他格式
        #access_log  logs/host.access.log  main;

        #关闭访问日志记录
        #access_log off;

        root   html;
        index  index.html index.htm;

        # 访问路径
        location / {
            root   html;
            index  index.html index.htm;
        }

        #error_page  404              /404.html;

        # redirect server error pages to the static page /50x.html
        #
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }



        #代理设置
        location / {
            #代理到 http://xxx.com，所有到这个location得请求都会被代理到http://xxx.com
            proxy_pass http://xxx.com/;
            # 代理超时时间，连接超时时间
            proxy_connect_timeout 60;
            #连接超时设置，(默认60秒)，如果请求上面得proxy_pass地址超过这个秒数还无返回，则报错
            proxy_read_timeout  60;
            #连接超时设置，(默认60秒)，发送超时时间
            proxy_send_timeout: 60;
        

        }


        # 代理设置 多个location 带路径，location 后面可以加 斜杠,最好加上， 被代理的 proxy_pass 后面必须要加 斜杠
        # 
        location /abc/ {
            proxy_pass http://xxx.com/;
        }


    }


    # http重定向到https
    server {
        listen 80;
        server_name yourdomain.com;
        return 301 https://$server_name$request_uri;
    }


    # HTTPS server
    #
    server {
        # 监听 443 ssl端口
        listen       443 ssl;
        # 域名
        server_name  example.com;

        # 禁止ip访问，只允许域名访问，设置了server_name并不能阻止ip访问
        if ($host != 'example.com') {
            return 444;
        }

        # 证书和私钥文件
        ssl_certificate      cert.pem;
        ssl_certificate_key  cert.key;

        ssl_session_cache    shared:SSL:1m;
        ssl_session_timeout  5m;

        ssl_ciphers  HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers  on;

        location / {
            root   html;
            index  index.html index.htm;
        }
    }





}
