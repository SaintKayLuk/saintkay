##########网络配置##########
# 绑定监听ip，默认绑定本机回环ip 127.0.0.1，也就是只能本机自己访问redis
# 如果服务器有2个ip，可以选择绑定哪个ip，或者用0.0.0.0绑定所有ip
bind 127.0.0.1
#监听端口
port 6379
#客户端空闲几秒后断开连接，为0则关闭此功能
timeout 0







##########普通配置##########
#redis是否以守护进程启动，默认不以守护进程使用
daemonize no
#当redis以守护进程启动时，默认pid文件(此文件内容就是pid)
pidfile /var/run/redis_6379.pid
#日志输出级别，debug，verbose，notice，warning，默认notice
loglevel notice
#指定日志文件名。空字符串也可以用来强制Redis登录标准输出请注意，如果daemonize为yes，即守护进程启动redis，则日志将被发送到/dev/null
#如果要启用日志文件，则设置一个日志文件，例logfile redis.log 会在redis项目目录为根目录下生成redis.log
logfile ""
#设置数据库数。默认数据库是db0，可以使用 SELECT <dbid> 来切换其他数据库，只有单机模式才有效，默认16个数据库，即 SELECT 15 来切换到第16个数据库
databases 16
#默认情况下，redis启动时会输出redis徽标，此选项可以设置后台启动，并有日志的情况下是否输出redis徽标
always-show-logo yes








##########数据存储配置##########
#RDB快照存储
#多长时间内，多少操作会将数据保存到磁盘中，默认有下面3个配置
save 900 1      #900秒(15分钟)内，至少1个key发生改变
save 300 10     #300秒(5分钟)内，至少10个key发生改变
save 60 10000   #60秒(1分钟)内，至少10000个key发生改变

#当rbd持久化，即写入磁盘失败，redis是否正常工作
stop-writes-on-bgsave-error yes
#存储时是否压缩，采用LZF压缩，如果为了节约cpu性能，则可关闭此选项 
rdbcompression yes
#在RDB5的版本中。CRC校验放文件末尾，数据更安全，稳定，但是性能会降低10%,禁用此功能可获得最佳性能，但是数据完整性没有保障，即不会进行CRC校验
rdbchecksum yes
#rdb数据文件名
dbfilename dump.rdb
#数据存储目录，RDB文件会在此目录创建，AOF文件会在创建在此目录下
dir ./








########## 主从配置 ##########
#master节点的ip和端口
# replicaof <masterip> <masterport>
#如果master节点有密码保护，则把密码写在这
# masterauth <master-password>
#当从节点与主节点失去连接时，或正在复制数据时候，此时读取从节点数据，
#设置为yes，则允许读取，但是数据有可能是旧的，或者没有数据，设置为no，则会抛出"SYNC with master in progress"错误，除去一些特殊命令
replica-serve-stale-data yes
#副本是否只读。默认只读
replica-read-only yes
#复制同步策略，有硬盘和无盘复制，默认复制需要磁盘
repl-diskless-sync no
#启用无盘复制时，等待复制前时间。复制时无法提供服务，默认为5秒。要完全禁用它，只需将其设置为0秒，传输将尽快开始。
repl-diskless-sync-delay 5
#副本以时间间隔向master发送ping，默认10秒
# repl-ping-replica-period 10
#超时时间。默认60秒
repl-timeout 60
#设置为yes，Redis将使用更少的TCP包和更少的带宽将数据发送到副本。但是这会增加数据出现在副本端的延迟，对于使用默认配置的Linux内核，延迟最长可达40毫秒。
repl-disable-tcp-nodelay no
#设置复制积压大小，当副本断开连接一段时间后，重新连接主节点，不需要复制所有数据，复制不同的数据即可，即backlog
# repl-backlog-size 1mb
#释放backlog，但不会因为超时而释放backlog，为0则从不释放backlog
# repl-backlog-ttl 3600
#副本优先级，默认100，在主节点不能正常工作时，会根据副本优先级将副本升级为主节点，优先升级优先级最低的副本，但是，特殊优先级为0的副本将标记为无法执行主副本的角色
replica-priority 100
#如果连接的副本少于N个，且延迟小于或等于M秒，则主机可能停止接受写入，将其中一个参数设置为0，则禁用此功能，默认情况下，要写入的最小副本数设置为0（功能已禁用），最小副本数最大延迟设置为10。
#例如要要求至少3个延迟<=10秒的副本
# min-replicas-to-write 3
# min-replicas-max-lag 10
#IP：通过检查副本用于连接主机的套接字的对等地址自动检测地址。
#端口：该端口在复制握手期间由复制副本进行通信，通常是复制副本用于侦听连接的端口。
#如果只需要覆盖端口或IP地址，则无需同时使用这两个选项。
# replica-announce-ip 5.5.5.5
# replica-announce-port 1234







########## 安全配置 ##########
#设置密码，默认没有密码，设置密码后，登陆redis的时候没有-a输入密码，则登陆之后在执行命令前需要 auth password 来验证密码
# requirepass foobared
#重命名一些特殊命令，例如把config命令设置为 b840f... 或者直接设置为""来完全禁用
# rename-command CONFIG b840fc02d524045429941cc15f59e41cb7be6c52
# rename-command CONFIG ""







########## 客户端配置 ##########
#最大客户端连接数，默认10000，但取决于linux最大文件打开数
#即如果最大文件打开数小于配置的最大客户端连接数，则最大连接数为最大文件打开数减去32(redis为内部保留的一些文件描述符)
# maxclients 10000 
########## 内存配置 ##########
########## LAZY FREEING ##########







########## aof持久化配置 ##########
#是否开启aof持久化(日志文件)，默认不开启
appendonly no
#附加文件的文件名，默认appendonly.aof
appendfilename "appendonly.aof"
#fsync持久化策略，always每次有命令执行都将写入磁盘aof文件，everysec在每秒写一次，no等操作系统进行数据缓存同步到磁盘
# appendfsync always
appendfsync everysec
# appendfsync no
#AOF重写期间是否禁止fsync，默认为no，设置为no的时候，aof文件重写的时候会造成堵塞，但是安全，设置为yes不会造成堵塞，但是最多会丢失30秒的数据(linux内核决定)
no-appendfsync-on-rewrite no

#重写条件
#当前大小大于指定大小百分比
auto-aof-rewrite-percentage 100
#指定aof文件大小，默认64mb
auto-aof-rewrite-min-size 64mb

#如果AOF文件结尾损坏，Redis启动时是否仍载入AOF文件
aof-load-truncated yes
#重写aof文件时，使用rdb为前导码，即由 [rdb file][aof tail]组成，并且加载redis时候，会加载前缀rdb文件和aof尾部
aof-use-rdb-preamble yes
 






