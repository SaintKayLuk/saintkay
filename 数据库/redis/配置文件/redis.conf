########## 慢日志 ##########
#记录慢于多少微秒的日志，1000000微妙等于1秒，默认10000微妙相当于10毫秒
slowlog-log-slower-than 10000
#慢日志保存条数，默认128条，会循环覆盖
slowlog-max-len 128